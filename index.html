<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bracket Generator</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="container">
        <div class="theme-control">
            <label for="themeSelector">Color theme</label>
            <select id="themeSelector">
                <option value="light">Light mode</option>
                <option value="dark">Dark mode</option>
                <option value="blue-mint">Blue and mint</option>
                <option value="red-black">Red and black</option>
                <option value="blue-shades">Blue shades and white</option>
            </select>
        </div>
        <h1>Bracket Generator</h1>

        <label for="categories">Number of Categories:</label>
        <input type="number" id="categories">
        <button id="startButton" type="button" disabled>Start &gt;</button>
        <section class="setup-background" aria-label="Bracket background photo">
            <h2>Background photo <span>(optional)</span></h2>
            <div class="setup-background-controls">
                <label class="setup-photo-button" for="backgroundPhotoFile">
                    Choose photo
                    <input
                        id="backgroundPhotoFile"
                        class="visually-hidden"
                        type="file"
                        accept="image/jpeg,image/png,image/webp"
                        aria-describedby="backgroundPhotoStatus"
                    >
                </label>
                <button id="removeBackgroundPhotoButton" class="setup-photo-remove" type="button" hidden>
                    Remove photo
                </button>
            </div>
            <p id="backgroundPhotoStatus" class="setup-background-status" role="status" aria-live="polite"></p>
        </section>
    </main>

    <script type="module" src="./theme.js"></script>
    <script type="module" src="./indexUI.js"></script>
</body>
</html>
