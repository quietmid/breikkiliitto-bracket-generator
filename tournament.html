<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament brackets</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body class="tournament-page">
    <main class="tournament-shell">
        <header class="tournament-header">
            <div class="tournament-toolbar">
                <a class="back-link tournament-back-link" href="./bracket.html">Edit categories</a>
                <div class="theme-control">
                    <label for="themeSelector">Color theme</label>
                    <select id="themeSelector">
                        <option value="light">Light mode</option>
                        <option value="dark">Dark mode</option>
                        <option value="blue-mint">Blue and mint</option>
                        <option value="red-black">Red and black</option>
                        <option value="blue-shades">Blue shades and white</option>
                    </select>
                </div>
            </div>
            <div id="tournamentTabs" class="tabs tournament-tabs" role="tablist" aria-label="Tournament categories"></div>
            <p id="tournamentSummary" class="tournament-summary"></p>
            <h1 id="tournamentTitle"></h1>
        </header>
        <section id="bracketRounds" class="bracket-rounds" aria-label="Tournament bracket">
            <div id="leftBracket" class="bracket-side bracket-side-left"></div>
            <div id="finalRound" class="bracket-final">
                <div id="finalMatch"></div>
                <section id="thirdPlaceRound" class="third-place-round" aria-label="Third place match" hidden>
                    <article class="match-card">
                        <div class="bracket-team-row">
                            <span id="thirdPlaceTeam0" class="third-place-team-name">TBD</span>
                            <button id="thirdPlaceChoice0" class="winner-choice" type="button" aria-label="Select third place winner">○</button>
                        </div>
                        <div class="bracket-team-row">
                            <span id="thirdPlaceTeam1" class="third-place-team-name">TBD</span>
                            <button id="thirdPlaceChoice1" class="winner-choice" type="button" aria-label="Select third place winner">○</button>
                        </div>
                    </article>
                </section>
                <label class="third-place-toggle" for="thirdPlaceToggle">
                    <input id="thirdPlaceToggle" type="checkbox">
                    <span>Third place match</span>
                </label>
            </div>
            <div id="rightBracket" class="bracket-side bracket-side-right"></div>
        </section>
    </main>
    <script type="module" src="./theme.js"></script>
    <script type="module" src="./tournament.js"></script>
</body>
</html>
